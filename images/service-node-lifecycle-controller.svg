<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1044" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs>
<marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
</defs>
<rect width="1060" height="1044" fill="#ffffff"/>
<text x="530.0" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Wie der Node-Lifecycle-Controller einen Node-Ausfall erkennt</text>
<rect x="15" y="50" width="190" height="62" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="110" y="77" text-anchor="middle" font-weight="bold" fill="#134e4a">kubelet</text>
<text x="110" y="97" text-anchor="middle" font-weight="bold" fill="#134e4a" font-size="13">Node B</text>
<line x1="110" y1="112" x2="110" y2="954" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="255" y="50" width="190" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="350" y="77" text-anchor="middle" font-weight="bold" fill="#1e3a8a">kube-apiserver</text>
<text x="350" y="97" text-anchor="middle" font-weight="bold" fill="#1e3a8a" font-size="13">+ etcd</text>
<line x1="350" y1="112" x2="350" y2="954" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="545" y="50" width="190" height="62" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="640" y="77" text-anchor="middle" font-weight="bold" fill="#78350f">Node-Lifecycle-</text>
<text x="640" y="97" text-anchor="middle" font-weight="bold" fill="#78350f" font-size="13">Controller</text>
<line x1="640" y1="112" x2="640" y2="954" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="825" y="50" width="190" height="62" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<text x="920" y="77" text-anchor="middle" font-weight="bold" fill="#78350f">EndpointSlice- und</text>
<text x="920" y="97" text-anchor="middle" font-weight="bold" fill="#78350f" font-size="12">Taint-Eviction-Controller</text>
<line x1="920" y1="112" x2="920" y2="954" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="10" y="154" width="1040" height="24" rx="4" fill="#f0fdf4" stroke="none"/>
<text x="20" y="171" font-weight="bold" fill="#14532d" font-size="13.5">A) Normalbetrieb</text>
<rect x="120" y="180" width="500.0" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="126" y="195" font-weight="bold" fill="#0f172a" font-size="13.5">kubelet erneuert seine Lease (alle 10 s)</text>
<text x="126" y="214" fill="#334155" font-size="12">UPDATE auf leases/&lt;node-name&gt; im Namespace kube-node-lease: spec.renewTime = now.</text>
<circle cx="28" cy="198" r="14" fill="#0f172a"/><text x="28" y="203" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<line x1="110" y1="240" x2="344" y2="240" stroke="#334155" stroke-width="2.2" marker-end="url(#mk)"/>
<rect x="326.0" y="272" width="716.0" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="332.0" y="287" font-weight="bold" fill="#0f172a" font-size="13.5">Der Node-Lifecycle-Controller bekommt die Lease per Watch (Lease-Informer)</text>
<text x="332.0" y="306" fill="#334155" font-size="12">Er merkt sich renewTime und den eigenen Zeitpunkt „probeTimestamp = now“. Es zählt seine Uhr, nicht die des Kubelets.</text>
<circle cx="28" cy="290" r="14" fill="#0f172a"/><text x="28" y="295" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<line x1="350" y1="332" x2="634" y2="332" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#md)"/>
<rect x="10" y="372" width="1040" height="24" rx="4" fill="#fef2f2" stroke="none"/>
<text x="20" y="389" font-weight="bold" fill="#7f1d1d" font-size="13.5">B) Node B fällt aus</text>
<rect x="120" y="398" width="632.0" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="126" y="413" font-weight="bold" fill="#0f172a" font-size="13.5">Kubelet tot: keine Lease-Updates mehr</text>
<text x="126" y="432" fill="#334155" font-size="12">Im API-Server bleiben die alte Lease, der Node-Status und der Pod-Status unverändert stehen (veraltet).</text>
<circle cx="28" cy="416" r="14" fill="#0f172a"/><text x="28" y="421" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<line x1="96" y1="444" x2="124" y2="472" stroke="#b91c1c" stroke-width="4"/><line x1="96" y1="472" x2="124" y2="444" stroke="#b91c1c" stroke-width="4"/>
<rect x="248.0" y="490" width="794.0" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="254.0" y="505" font-weight="bold" fill="#0f172a" font-size="13.5">Alle 5 s: Ist „now − probeTimestamp“ größer als 50 s?</text>
<text x="254.0" y="524" fill="#334155" font-size="12">Prüfung monitorNodeHealth. Solange neue renewTime-Werte ankommen: nein. Aktuell: ja, die node-monitor-grace-period ist abgelaufen.</text>
<circle cx="28" cy="508" r="14" fill="#0f172a"/><text x="28" y="513" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<path d="M640,542 C710,542 710,562 646,562" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#mk)"/>
<rect x="290.0" y="582" width="752.0" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="296.0" y="597" font-weight="bold" fill="#0f172a" font-size="13.5">Node-Status auf Unknown setzen</text>
<text x="296.0" y="616" fill="#334155" font-size="12">UpdateStatus auf nodes/&lt;node-name&gt;: Ready (und Memory-/Disk-/PIDPressure) = Unknown, „Kubelet stopped posting node status.“</text>
<circle cx="28" cy="600" r="14" fill="#0f172a"/><text x="28" y="605" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
<line x1="640" y1="642" x2="356" y2="642" stroke="#334155" stroke-width="2.2" marker-end="url(#mk)"/>
<rect x="360" y="674" width="608.0" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="366" y="689" font-weight="bold" fill="#0f172a" font-size="13.5">Taints am Node setzen</text>
<text x="366" y="708" fill="#334155" font-size="12">node.kubernetes.io/unreachable in node.spec.taints, einmal als NoSchedule und einmal als NoExecute.</text>
<circle cx="28" cy="692" r="14" fill="#0f172a"/><text x="28" y="697" text-anchor="middle" fill="#fff" font-weight="bold">6</text>
<line x1="640" y1="734" x2="356" y2="734" stroke="#334155" stroke-width="2.2" marker-end="url(#mk)"/>
<rect x="224.0" y="766" width="818.0" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="230.0" y="781" font-weight="bold" fill="#0f172a" font-size="13.5">Pods des Nodes auf Ready=False setzen</text>
<text x="230.0" y="800" fill="#334155" font-size="12">Die Pods findet er im lokalen Pod-Cache über spec.nodeName, dann UpdateStatus auf pods/&lt;pod&gt;/status. (Reihenfolge 5–7 kann abweichen.)</text>
<circle cx="28" cy="784" r="14" fill="#0f172a"/><text x="28" y="789" text-anchor="middle" fill="#fff" font-weight="bold">7</text>
<line x1="640" y1="826" x2="356" y2="826" stroke="#334155" stroke-width="2.2" marker-end="url(#mk)"/>
<rect x="236.0" y="858" width="806.0" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="242.0" y="873" font-weight="bold" fill="#0f172a" font-size="13.5">Weitere Controller reagieren per Watch</text>
<text x="242.0" y="892" fill="#334155" font-size="12">EndpointSlice-Controller: ready=false am Endpoint. Taint-Eviction-Controller: löscht den Pod nach tolerationSeconds (Default 300 s).</text>
<circle cx="28" cy="876" r="14" fill="#0f172a"/><text x="28" y="881" text-anchor="middle" fill="#fff" font-weight="bold">8</text>
<line x1="350" y1="918" x2="914" y2="918" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#md)"/>
<line x1="30" y1="974" x2="80" y2="974" stroke="#334155" stroke-width="2.2" marker-end="url(#mk)"/>
<text x="90" y="978" fill="#334155" font-size="12.5">schreibt in den API-Server</text>
<line x1="330" y1="974" x2="380" y2="974" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#md)"/>
<text x="390" y="978" fill="#334155" font-size="12.5">Watch-Event vom API-Server</text>
<text x="30" y="1008" fill="#475569" font-size="12">Alle Werte sind Defaults: Lease-Takt 10 s, Prüfintervall 5 s (node-monitor-period), Frist 50 s (node-monitor-grace-period, ab v1.32), tolerationSeconds 300 s.</text>
</svg>