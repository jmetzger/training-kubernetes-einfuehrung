<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs>
<marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
</defs>
<rect width="1100" height="620" fill="#ffffff"/>
<text x="550" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Gateway API mit Traefik: so kommt ein Request zur App</text>

<!-- DNS -->
<rect x="20" y="85" width="215" height="62" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="127" y="108" text-anchor="middle" font-weight="bold" fill="#713f12">DNS (Wildcard)</text>
<text x="127" y="126" text-anchor="middle" font-size="12" fill="#713f12">*.app-gw.do.t3isp.de</text>
<text x="127" y="141" text-anchor="middle" font-size="12" fill="#713f12">→ 157.245.26.123</text>
<line x1="95" y1="250" x2="95" y2="149" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#mk)"/>
<text x="103" y="205" font-size="11" fill="#713f12">1 Namen aufloesen</text>

<!-- Client -->
<rect x="20" y="252" width="170" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="105" y="278" text-anchor="middle" font-weight="bold" fill="#0f172a">Browser / curl</text>
<text x="105" y="298" text-anchor="middle" font-size="11" fill="#0f172a">josef.app-gw.do.t3isp.de</text>

<!-- LB -->
<rect x="240" y="252" width="125" height="68" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="302" y="278" text-anchor="middle" font-weight="bold" fill="#0c4a6e">LoadBalancer</text>
<text x="302" y="298" text-anchor="middle" font-size="12" fill="#0c4a6e">157.245.26.123</text>
<line x1="190" y1="286" x2="240" y2="286" stroke="#334155" stroke-width="2" marker-end="url(#mk)"/>
<text x="215" y="278" text-anchor="middle" font-size="11" fill="#334155">2</text>

<!-- Cluster -->
<rect x="390" y="50" width="695" height="525" rx="12" fill="#fafafa" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
<text x="404" y="70" font-weight="bold" fill="#475569">Kubernetes-Cluster (DOKS)</text>

<!-- ns ingress -->
<rect x="410" y="85" width="300" height="205" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="422" y="104" font-weight="bold" fill="#1e3a8a">Namespace ingress</text>
<text x="700" y="104" text-anchor="end" font-size="11" fill="#1e3a8a">Trainer</text>
<rect x="430" y="115" width="260" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="560" y="133" text-anchor="middle" font-weight="bold" fill="#1e3a8a">GatewayClass traefik</text>
<text x="560" y="149" text-anchor="middle" font-size="11" fill="#1e3a8a">Traefik ist der Controller (Konfig-Objekt)</text>
<rect x="430" y="167" width="260" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="560" y="185" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Pod Traefik</text>
<text x="560" y="203" text-anchor="middle" font-size="11" fill="#1e3a8a">per Helm installiert, Entrypoint web :8000</text>
<rect x="430" y="224" width="260" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="560" y="242" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Gateway shared-gateway</text>
<text x="560" y="259" text-anchor="middle" font-size="11" fill="#1e3a8a">nur Konfiguration (Traefik liest sie), kein Pod</text>
<text x="560" y="273" text-anchor="middle" font-size="11" fill="#1e3a8a">Listener web :8000, Routen aus allen Namespaces</text>

<!-- LB -> Traefik -->
<path d="M365,286 L398,286 L398,190 L430,190" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#mk)"/>
<text x="378" y="240" font-size="11" fill="#334155" transform="rotate(-90 378 240)" text-anchor="middle">3</text>

<!-- ns teilnehmer -->
<rect x="410" y="320" width="665" height="240" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="422" y="339" font-weight="bold" fill="#14532d">Namespace gateway-josef</text>
<text x="1065" y="339" text-anchor="end" font-size="11" fill="#14532d">Teilnehmer</text>

<rect x="430" y="355" width="250" height="150" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="555" y="375" text-anchor="middle" font-weight="bold" fill="#4c1d95">HTTPRoute example-route</text>
<text x="442" y="399" font-size="11" fill="#4c1d95">hostnames: josef.app-gw.do.t3isp.de</text>
<text x="442" y="419" font-size="11" fill="#4c1d95">/apple  → apple-service</text>
<text x="442" y="437" font-size="11" fill="#4c1d95">/banana → banana-service</text>
<text x="442" y="457" font-size="11" fill="#4c1d95">weitere Regeln: Header-Match,</text>
<text x="442" y="471" font-size="11" fill="#4c1d95">Gewichtung (80/20), Redirect</text>
<text x="442" y="493" font-size="11" font-weight="bold" fill="#4c1d95">parentRefs: shared-gateway (ns ingress)</text>

<!-- parentRefs dashed -->
<path d="M520,355 L520,282" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#md)"/>
<text x="528" y="322" font-size="11" fill="#6d28d9">haengt sich an</text>

<!-- Traefik -> Services -->
<path d="M690,190 L716,190 L716,462" fill="none" stroke="#334155" stroke-width="2"/>
<path d="M716,384 L748,384" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#mk)"/>
<path d="M716,462 L748,462" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#mk)"/>
<text x="722" y="300" font-size="11" fill="#334155">4 Route</text>
<text x="722" y="314" font-size="11" fill="#334155">gefunden</text>

<rect x="750" y="362" width="150" height="44" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="825" y="381" text-anchor="middle" font-weight="bold" fill="#14532d">apple-service</text>
<text x="825" y="396" text-anchor="middle" font-size="11" fill="#14532d">Service :80</text>
<rect x="750" y="440" width="150" height="44" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="825" y="459" text-anchor="middle" font-weight="bold" fill="#14532d">banana-service</text>
<text x="825" y="474" text-anchor="middle" font-size="11" fill="#14532d">Service :80</text>

<line x1="900" y1="384" x2="940" y2="384" stroke="#334155" stroke-width="2" marker-end="url(#mk)"/>
<line x1="900" y1="462" x2="940" y2="462" stroke="#334155" stroke-width="2" marker-end="url(#mk)"/>
<rect x="942" y="362" width="120" height="44" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
<text x="1002" y="381" text-anchor="middle" font-weight="bold" fill="#14532d">Pod apple</text>
<text x="1002" y="396" text-anchor="middle" font-size="11" fill="#14532d">:5678 apple-josef</text>
<rect x="942" y="440" width="120" height="44" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
<text x="1002" y="459" text-anchor="middle" font-weight="bold" fill="#14532d">Pod banana</text>
<text x="1002" y="474" text-anchor="middle" font-size="11" fill="#14532d">:5678 banana-josef</text>
<text x="920" y="528" text-anchor="middle" font-size="11" fill="#14532d">5 Request landet im Pod</text>

<!-- Legende -->
<line x1="30" y1="590" x2="70" y2="590" stroke="#334155" stroke-width="2" marker-end="url(#mk)"/>
<text x="78" y="594" font-size="12" fill="#334155">Weg des Requests</text>
<line x1="230" y1="590" x2="270" y2="590" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#md)"/>
<text x="278" y="594" font-size="12" fill="#334155">Konfiguration (Route → Gateway)</text>
<text x="560" y="594" font-size="12" fill="#334155">Gleicher Traefik bedient auch Ingress (ingressClassName: traefik), nur andere Domain: *.appv2</text>
</svg>
