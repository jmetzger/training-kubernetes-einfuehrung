<svg width="780" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="780" height="340" fill="#F8FAFC" rx="12"/>
  <text x="390" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">KMS Key-Typen &amp; typische Integrationen</text>

  <!-- Key Typen -->
  <text x="40" y="66" font-size="12" font-weight="bold" fill="#1E293B">Key-Typen</text>

  <rect x="40" y="78" width="220" height="54" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="150" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">AWS managed key</text>
  <text x="150" y="118" text-anchor="middle" font-size="10" fill="#92400E">von AWS erstellt &amp; rotiert</text>

  <rect x="40" y="140" width="220" height="54" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="150" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">Customer managed key</text>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="#1E40AF">volle Kontrolle (Policy, Rotation)</text>

  <rect x="40" y="202" width="220" height="54" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="8"/>
  <text x="150" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B21B6">Alias</text>
  <text x="150" y="242" text-anchor="middle" font-size="10" fill="#5B21B6">z.B. "alias/prod-db"</text>

  <line x1="260" y1="167" x2="150" y2="202" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="205" y="187" text-anchor="middle" font-size="9" fill="#94A3B8">zeigt auf</text>

  <!-- Pfeil zu Services -->
  <line x1="260" y1="169" x2="330" y2="169" stroke="#64748B" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="295" y="159" text-anchor="middle" font-size="10" fill="#64748B">nutzt</text>

  <!-- Services die KMS nutzen -->
  <text x="500" y="66" font-size="12" font-weight="bold" fill="#1E293B">Wird genutzt von</text>

  <rect x="333" y="78" width="150" height="42" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="6"/>
  <text x="408" y="103" text-anchor="middle" font-size="11" fill="#166534">S3 (SSE-KMS)</text>

  <rect x="333" y="128" width="150" height="42" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="6"/>
  <text x="408" y="153" text-anchor="middle" font-size="11" fill="#166534">EBS Volumes</text>

  <rect x="333" y="178" width="150" height="42" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="6"/>
  <text x="408" y="203" text-anchor="middle" font-size="11" fill="#166534">RDS Datenbanken</text>

  <rect x="333" y="228" width="150" height="42" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="6"/>
  <text x="408" y="253" text-anchor="middle" font-size="11" fill="#166534">Secrets Manager</text>

  <line x1="150" y1="256" x2="150" y2="270" stroke="#64748B" stroke-width="2"/>
  <line x1="150" y1="270" x2="408" y2="270" stroke="#64748B" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- EKS Secrets rechts -->
  <rect x="533" y="128" width="210" height="42" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" rx="6"/>
  <text x="638" y="153" text-anchor="middle" font-size="11" fill="#9A3412">EKS Secrets Encryption</text>

  <line x1="483" y1="149" x2="533" y2="149" stroke="#64748B" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Kernaussage -->
  <rect x="40" y="286" width="700" height="42" fill="#EEF2FF" stroke="#6366F1" stroke-width="1" rx="6"/>
  <text x="390" y="304" text-anchor="middle" font-size="11" fill="#4338CA">Fast jeder AWS-Dienst mit "verschlüsselt speichern" (encryption at rest)</text>
  <text x="390" y="318" text-anchor="middle" font-size="11" fill="#4338CA">nutzt im Hintergrund einen KMS-Key.</text>
</svg>
