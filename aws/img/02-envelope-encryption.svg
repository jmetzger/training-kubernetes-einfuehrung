<svg width="780" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="780" height="360" fill="#F8FAFC" rx="12"/>
  <text x="390" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">Envelope Encryption (so verschlüsselt KMS wirklich)</text>

  <!-- Step 1 -->
  <text x="40" y="70" font-size="12" font-weight="bold" fill="#1E293B">1. Data Key anfordern</text>
  <rect x="40" y="82" width="200" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" rx="8"/>
  <text x="140" y="107" text-anchor="middle" font-size="11" fill="#1D4ED8">App ruft</text>
  <text x="140" y="124" text-anchor="middle" font-size="11" fill="#1D4ED8">GenerateDataKey auf</text>

  <line x1="240" y1="112" x2="300" y2="112" stroke="#64748B" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="303" y="82" width="180" height="60" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="393" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">KMS (Master Key)</text>
  <text x="393" y="124" text-anchor="middle" font-size="11" fill="#92400E">erzeugt Data Key</text>

  <line x1="393" y1="142" x2="393" y2="176" stroke="#64748B" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="470" y="163" font-size="10" fill="#64748B">liefert 2 Varianten zurück</text>

  <!-- Zwei Varianten -->
  <rect x="303" y="180" width="180" height="46" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="6"/>
  <text x="393" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Plaintext Data Key</text>
  <text x="393" y="216" text-anchor="middle" font-size="9" fill="#166534">nur kurz im RAM der App</text>

  <rect x="303" y="234" width="180" height="46" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="6"/>
  <text x="393" y="254" text-anchor="middle" font-size="10" font-weight="bold" fill="#991B1B">Encrypted Data Key</text>
  <text x="393" y="270" text-anchor="middle" font-size="9" fill="#991B1B">mit Master Key verschlüsselt</text>

  <!-- Step 2: Nutzung -->
  <line x1="483" y1="203" x2="556" y2="150" stroke="#64748B" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="600" y="150" text-anchor="middle" font-size="10" fill="#64748B">verschlüsselt Daten lokal</text>

  <rect x="556" y="120" width="200" height="60" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" rx="8"/>
  <text x="656" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338CA">Verschlüsselte Nutzdaten</text>
  <text x="656" y="163" text-anchor="middle" font-size="10" fill="#4338CA">(z.B. große Datei in S3)</text>

  <line x1="483" y1="257" x2="656" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="656" y="196" text-anchor="middle" font-size="10" fill="#64748B">wird zusammen gespeichert</text>

  <!-- gespeichert zusammen -->
  <rect x="556" y="200" width="200" height="60" fill="#F5F5F4" stroke="#78716C" stroke-width="2" rx="8"/>
  <text x="656" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#44403C">Speicherort (z.B. S3)</text>
  <text x="656" y="240" text-anchor="middle" font-size="9" fill="#44403C">Daten + Encrypted Data Key</text>
  <text x="656" y="253" text-anchor="middle" font-size="9" fill="#44403C">liegen zusammen</text>

  <!-- Kernaussage unten -->
  <rect x="40" y="300" width="700" height="46" fill="#EEF2FF" stroke="#6366F1" stroke-width="1" rx="6"/>
  <text x="390" y="318" text-anchor="middle" font-size="11" fill="#4338CA">Große Datenmengen werden lokal mit dem Data Key verschlüsselt (schnell) —</text>
  <text x="390" y="334" text-anchor="middle" font-size="11" fill="#4338CA">nur der kleine Data Key selbst braucht KMS zum Ver-/Entschlüsseln.</text>
</svg>
