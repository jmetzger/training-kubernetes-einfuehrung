<svg width="820" height="230" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrD" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="820" height="230" fill="#F8FAFC" rx="12"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">Aufbau einer Secrets-Manager-ARN</text>

  <!-- ARN string as segmented boxes -->
  <rect x="20" y="60" width="70" height="34" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" rx="4"/>
  <text x="55" y="82" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#4338CA">arn:aws</text>

  <rect x="94" y="60" width="140" height="34" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="4"/>
  <text x="164" y="82" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#1E40AF">secretsmanager</text>

  <rect x="238" y="60" width="110" height="34" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="4"/>
  <text x="293" y="82" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#166534">eu-central-1</text>

  <rect x="352" y="60" width="130" height="34" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="4"/>
  <text x="417" y="82" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#92400E">123456789012</text>

  <rect x="486" y="60" width="60" height="34" fill="#F5F5F4" stroke="#78716C" stroke-width="2" rx="4"/>
  <text x="516" y="82" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#44403C">secret</text>

  <rect x="550" y="60" width="150" height="34" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="4"/>
  <text x="625" y="82" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#5B21B6">prod/db-credentials</text>

  <rect x="704" y="60" width="96" height="34" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="4"/>
  <text x="752" y="82" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#991B1B">-AbCdEf</text>

  <!-- Separators between segments (visual colons/slashes only via gaps) -->

  <!-- Labels below with connector lines -->
  <line x1="55" y1="94" x2="55" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="55" y="126" text-anchor="middle" font-size="9" fill="#64748B">Präfix</text>

  <line x1="164" y1="94" x2="164" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="164" y="126" text-anchor="middle" font-size="9" fill="#64748B">Service</text>

  <line x1="293" y1="94" x2="293" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="293" y="126" text-anchor="middle" font-size="9" fill="#64748B">Region</text>

  <line x1="417" y1="94" x2="417" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="417" y="126" text-anchor="middle" font-size="9" fill="#64748B">Account-ID</text>

  <line x1="516" y1="94" x2="516" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="516" y="126" text-anchor="middle" font-size="9" fill="#64748B">Ressourcentyp</text>

  <line x1="625" y1="94" x2="625" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="625" y="126" text-anchor="middle" font-size="9" fill="#64748B">dein Secret-Name</text>

  <line x1="752" y1="94" x2="752" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="752" y="126" text-anchor="middle" font-size="9" fill="#64748B">Zufalls-Suffix</text>

  <!-- Explanation box -->
  <rect x="20" y="150" width="780" height="64" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" rx="8"/>
  <text x="410" y="170" text-anchor="middle" font-size="11" fill="#9A3412">AWS hängt beim Anlegen automatisch 6 Zufallszeichen an deinen Secret-Namen an —</text>
  <text x="410" y="186" text-anchor="middle" font-size="11" fill="#9A3412">so bekommt ein neu angelegtes Secret mit demselben Namen eine andere ARN als ein gelöschtes altes.</text>
  <text x="410" y="202" text-anchor="middle" font-size="11" fill="#9A3412">Deshalb steht in der IAM-Policy meist ein "-*" Wildcard am Ende der Resource-ARN.</text>
</svg>
