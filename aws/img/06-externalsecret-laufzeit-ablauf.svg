<svg width="860" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrE" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="860" height="560" fill="#F8FAFC" rx="12"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">Ablauf: ExternalSecret → Kubernetes Secret (zur Laufzeit)</text>

  <!-- Lane headers -->
  <rect x="24" y="52" width="380" height="470" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="214" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">Kubernetes Cluster</text>

  <rect x="428" y="52" width="408" height="470" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="632" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">AWS</text>

  <!-- Step 1 -->
  <circle cx="60" cy="108" r="14" fill="#6366F1"/>
  <text x="60" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="white">1</text>
  <rect x="86" y="88" width="290" height="46" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" rx="8"/>
  <text x="231" y="106" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338CA">kubectl apply -f externalsecret.yml</text>
  <text x="231" y="122" text-anchor="middle" font-size="9" fill="#4338CA">API Server speichert das Objekt (etcd)</text>

  <line x1="231" y1="134" x2="231" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#arrE)"/>

  <!-- Step 2 -->
  <circle cx="60" cy="186" r="14" fill="#6366F1"/>
  <text x="60" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="white">2</text>
  <rect x="86" y="164" width="290" height="46" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="8"/>
  <text x="231" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#5B21B6">ESO-Controller (Watch)</text>
  <text x="231" y="198" text-anchor="middle" font-size="9" fill="#5B21B6">bemerkt neues/geändertes ExternalSecret</text>

  <line x1="231" y1="210" x2="231" y2="236" stroke="#64748B" stroke-width="2" marker-end="url(#arrE)"/>

  <!-- Step 3 -->
  <circle cx="60" cy="262" r="14" fill="#6366F1"/>
  <text x="60" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="white">3</text>
  <rect x="86" y="240" width="290" height="52" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="8"/>
  <text x="231" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#5B21B6">liest referenzierten SecretStore</text>
  <text x="231" y="273" text-anchor="middle" font-size="9" fill="#5B21B6">Region, Secret-Name + ServiceAccount</text>
  <text x="231" y="286" text-anchor="middle" font-size="9" fill="#5B21B6">für die Anmeldung</text>

  <!-- Cross to AWS: step 4 -->
  <line x1="376" y1="266" x2="450" y2="266" stroke="#64748B" stroke-width="2" marker-end="url(#arrE)"/>
  <text x="413" y="256" text-anchor="middle" font-size="8" fill="#64748B">JWT</text>

  <circle cx="472" cy="266" r="14" fill="#059669"/>
  <text x="472" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="white">4</text>
  <rect x="498" y="242" width="310" height="48" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="653" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">AWS STS: AssumeRoleWithWebIdentity</text>
  <text x="653" y="276" text-anchor="middle" font-size="9" fill="#166534">prüft JWT, liefert kurzlebige AWS-Zugangsdaten</text>

  <line x1="653" y1="290" x2="653" y2="316" stroke="#64748B" stroke-width="2" marker-end="url(#arrE)"/>

  <!-- Step 5 -->
  <circle cx="472" cy="342" r="14" fill="#059669"/>
  <text x="472" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="white">5</text>
  <rect x="498" y="318" width="310" height="52" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="653" y="336" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">Secrets Manager: GetSecretValue</text>
  <text x="653" y="351" text-anchor="middle" font-size="9" fill="#1E40AF">entschlüsselt intern via KMS</text>
  <text x="653" y="364" text-anchor="middle" font-size="9" fill="#1E40AF">liefert Klartext-Wert an ESO zurück</text>

  <!-- Back to Kubernetes: step 6 -->
  <line x1="498" y1="344" x2="376" y2="410" stroke="#64748B" stroke-width="2" marker-end="url(#arrE)"/>
  <text x="440" y="380" text-anchor="middle" font-size="8" fill="#64748B" transform="rotate(20 440 380)">Wert (verschlüsselt via TLS)</text>

  <circle cx="60" cy="422" r="14" fill="#6366F1"/>
  <text x="60" y="427" text-anchor="middle" font-size="12" font-weight="bold" fill="white">6</text>
  <rect x="86" y="400" width="290" height="46" fill="#F5F5F4" stroke="#78716C" stroke-width="2" rx="8"/>
  <text x="231" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#44403C">ESO erstellt/aktualisiert</text>
  <text x="231" y="434" text-anchor="middle" font-size="9" fill="#44403C">Kubernetes Secret (target.name)</text>

  <line x1="231" y1="446" x2="231" y2="472" stroke="#64748B" stroke-width="2" marker-end="url(#arrE)"/>

  <!-- Step 7 -->
  <circle cx="60" cy="498" r="14" fill="#6366F1"/>
  <text x="60" y="503" text-anchor="middle" font-size="12" font-weight="bold" fill="white">7</text>
  <rect x="86" y="476" width="290" height="46" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" rx="8"/>
  <text x="231" y="494" text-anchor="middle" font-size="10" font-weight="bold" fill="#1D4ED8">Pod liest Secret (env/volume)</text>
  <text x="231" y="510" text-anchor="middle" font-size="9" fill="#1D4ED8">Schritte 3-6 wiederholen sich alle refreshInterval</text>

  <!-- refresh loop arrow -->
  <path d="M 376 490 C 410 490, 410 262, 376 262" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrE)"/>
</svg>
