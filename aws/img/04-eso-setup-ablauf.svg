<svg width="860" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrC" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="860" height="460" fill="#F8FAFC" rx="12"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">External Secrets Operator + AWS Secrets Manager/KMS — Setup-Ablauf</text>

  <!-- AWS box -->
  <rect x="24" y="56" width="360" height="360" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="204" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">AWS (einmalig einrichten)</text>

  <!-- Step 1: KMS + Secret -->
  <rect x="46" y="92" width="150" height="60" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="121" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">1. KMS Key</text>
  <text x="121" y="128" text-anchor="middle" font-size="9" fill="#92400E">verschlüsselt das</text>
  <text x="121" y="142" text-anchor="middle" font-size="9" fill="#92400E">Secret automatisch</text>

  <rect x="212" y="92" width="150" height="60" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="287" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">2. Secrets Manager</text>
  <text x="287" y="128" text-anchor="middle" font-size="9" fill="#1E40AF">Secret anlegen</text>
  <text x="287" y="142" text-anchor="middle" font-size="9" fill="#1E40AF">(z.B. db-password)</text>

  <line x1="196" y1="122" x2="210" y2="122" stroke="#64748B" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Step 3: IAM Policy + Role -->
  <line x1="287" y1="152" x2="287" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrC)"/>
  <rect x="46" y="184" width="316" height="70" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="204" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">3. IAM Policy + IAM Role (IRSA)</text>
  <text x="204" y="222" text-anchor="middle" font-size="9" fill="#166534">Policy: GetSecretValue nur auf diese ARN</text>
  <text x="204" y="238" text-anchor="middle" font-size="9" fill="#166534">Trust Policy: OIDC Provider des EKS-Clusters</text>

  <!-- Explanation box AWS -->
  <rect x="46" y="330" width="316" height="70" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" rx="8"/>
  <text x="204" y="350" text-anchor="middle" font-size="9" fill="#9A3412">Kein Access Key / Secret Key im Cluster —</text>
  <text x="204" y="366" text-anchor="middle" font-size="9" fill="#9A3412">Auth läuft über kurzlebige, gerollte</text>
  <text x="204" y="382" text-anchor="middle" font-size="9" fill="#9A3412">STS-Tokens (IRSA / Pod Identity)</text>

  <!-- Kubernetes box -->
  <rect x="418" y="56" width="418" height="360" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="627" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">Kubernetes Cluster</text>

  <line x1="362" y1="219" x2="440" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Step 4: Helm install -->
  <rect x="440" y="150" width="180" height="60" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="8"/>
  <text x="530" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#5B21B6">4. helm install</text>
  <text x="530" y="188" text-anchor="middle" font-size="9" fill="#5B21B6">external-secrets</text>
  <text x="530" y="202" text-anchor="middle" font-size="9" fill="#5B21B6">(Chart installiert CRDs + Operator)</text>

  <!-- ServiceAccount -->
  <rect x="640" y="150" width="170" height="60" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="8"/>
  <text x="725" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#5B21B6">ServiceAccount</text>
  <text x="725" y="188" text-anchor="middle" font-size="9" fill="#5B21B6">Annotation:</text>
  <text x="725" y="202" text-anchor="middle" font-size="9" fill="#5B21B6">role-arn = ...</text>

  <line x1="530" y1="210" x2="530" y2="238" stroke="#64748B" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Step 5: SecretStore -->
  <rect x="440" y="242" width="180" height="56" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="530" y="262" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">5. SecretStore</text>
  <text x="530" y="278" text-anchor="middle" font-size="9" fill="#1E40AF">Verbindung zu AWS</text>
  <text x="530" y="292" text-anchor="middle" font-size="9" fill="#1E40AF">(Region, Auth via SA)</text>

  <line x1="530" y1="298" x2="530" y2="326" stroke="#64748B" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Step 6: ExternalSecret -->
  <rect x="440" y="330" width="180" height="56" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="530" y="350" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">6. ExternalSecret</text>
  <text x="530" y="366" text-anchor="middle" font-size="9" fill="#92400E">verweist auf Secret-Name</text>
  <text x="530" y="380" text-anchor="middle" font-size="9" fill="#92400E">+ Ziel-Secret-Name in K8s</text>

  <line x1="620" y1="358" x2="648" y2="358" stroke="#64748B" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- K8s Secret -->
  <rect x="651" y="330" width="160" height="56" fill="#F5F5F4" stroke="#78716C" stroke-width="2" rx="8"/>
  <text x="731" y="350" text-anchor="middle" font-size="10" font-weight="bold" fill="#44403C">7. Kubernetes</text>
  <text x="731" y="366" text-anchor="middle" font-size="10" font-weight="bold" fill="#44403C">Secret (erzeugt)</text>
  <text x="731" y="380" text-anchor="middle" font-size="9" fill="#44403C">wird periodisch synced</text>

  <line x1="731" y1="386" x2="731" y2="404" stroke="#64748B" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="770" y="398" text-anchor="middle" font-size="9" fill="#64748B">env/volume</text>

  <rect x="651" y="408" width="160" height="0" fill="none"/>
</svg>
