<svg width="780" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="780" height="300" fill="#F8FAFC" rx="12"/>
  <text x="390" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">AWS KMS — Grundprinzip</text>

  <!-- User / App -->
  <rect x="24" y="110" width="150" height="80" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" rx="8"/>
  <text x="99" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">Deine App</text>
  <text x="99" y="164" text-anchor="middle" font-size="11" fill="#1D4ED8">(hat IAM-Rechte)</text>

  <line x1="174" y1="150" x2="250" y2="150" stroke="#64748B" stroke-width="2" marker-end="url(#arr1)"/>
  <text x="212" y="140" text-anchor="middle" font-size="10" fill="#64748B">Encrypt/Decrypt</text>
  <text x="212" y="167" text-anchor="middle" font-size="10" fill="#64748B">API-Call</text>

  <!-- KMS -->
  <rect x="253" y="90" width="230" height="120" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="368" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">AWS KMS</text>
  <text x="368" y="140" text-anchor="middle" font-size="11" fill="#92400E">verwaltet Master-Keys</text>
  <text x="368" y="158" text-anchor="middle" font-size="11" fill="#92400E">(CMK) — verlassen NIE</text>
  <text x="368" y="176" text-anchor="middle" font-size="11" fill="#92400E">den KMS-Dienst</text>
  <rect x="323" y="184" width="90" height="18" fill="#FDE68A" stroke="#D97706" rx="4"/>
  <text x="368" y="197" text-anchor="middle" font-size="9" fill="#92400E">HSM-gesichert</text>

  <line x1="483" y1="150" x2="556" y2="150" stroke="#64748B" stroke-width="2" marker-end="url(#arr1)"/>
  <text x="519" y="140" text-anchor="middle" font-size="10" fill="#64748B">verschlüsselte</text>
  <text x="519" y="167" text-anchor="middle" font-size="10" fill="#64748B">Daten zurück</text>

  <!-- Ergebnis -->
  <rect x="559" y="100" width="200" height="100" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="659" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Ciphertext</text>
  <text x="659" y="150" text-anchor="middle" font-size="11" fill="#166534">z.B. in S3, EBS,</text>
  <text x="659" y="168" text-anchor="middle" font-size="11" fill="#166534">RDS, Secrets Manager</text>

  <!-- Kernaussage unten -->
  <rect x="60" y="234" width="660" height="46" fill="#EEF2FF" stroke="#6366F1" stroke-width="1" rx="6"/>
  <text x="390" y="252" text-anchor="middle" font-size="11" fill="#4338CA">KMS verschlüsselt/entschlüsselt Daten nie selbst dauerhaft im Klartext —</text>
  <text x="390" y="268" text-anchor="middle" font-size="11" fill="#4338CA">es verwaltet nur die Schlüssel. Rechte werden über IAM-Policies gesteuert.</text>
</svg>
