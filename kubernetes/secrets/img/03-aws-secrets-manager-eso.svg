<svg width="820" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="820" height="380" fill="#F8FAFC" rx="12"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">AWS Secrets Manager + KMS → Kubernetes (via External Secrets Operator)</text>

  <!-- AWS side box -->
  <rect x="24" y="56" width="330" height="240" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="189" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">AWS</text>

  <!-- KMS -->
  <rect x="50" y="92" width="130" height="60" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="115" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">AWS KMS</text>
  <text x="115" y="134" text-anchor="middle" font-size="10" fill="#92400E">Master Key (CMK)</text>

  <line x1="180" y1="122" x2="228" y2="122" stroke="#64748B" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="204" y="112" text-anchor="middle" font-size="9" fill="#64748B">verschlüsselt</text>

  <!-- Secrets Manager -->
  <rect x="230" y="92" width="112" height="60" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="286" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">Secrets</text>
  <text x="286" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">Manager</text>
  <text x="286" y="142" text-anchor="middle" font-size="9" fill="#1E40AF">(DB-Passwort etc.)</text>

  <!-- IAM Role for ESO -->
  <rect x="50" y="180" width="292" height="70" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="196" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">IAM Role (IRSA / EKS Pod Identity)</text>
  <text x="196" y="220" text-anchor="middle" font-size="10" fill="#166534">erlaubt nur: GetSecretValue auf</text>
  <text x="196" y="236" text-anchor="middle" font-size="10" fill="#166534">genau diese Secret-ARN(s)</text>

  <line x1="286" y1="152" x2="286" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="330" y="169" text-anchor="middle" font-size="9" fill="#64748B">nutzt Rolle</text>

  <!-- Kubernetes side -->
  <rect x="410" y="56" width="386" height="240" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
  <text x="603" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">Kubernetes Cluster</text>

  <!-- Cross-boundary arrow -->
  <line x1="342" y1="215" x2="440" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="380" y="165" text-anchor="middle" font-size="9" fill="#64748B" transform="rotate(-28 380 165)">API-Call (OIDC)</text>

  <!-- ESO -->
  <rect x="436" y="92" width="180" height="70" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="8"/>
  <text x="526" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B21B6">External Secrets</text>
  <text x="526" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B21B6">Operator (ESO)</text>
  <text x="526" y="148" text-anchor="middle" font-size="9" fill="#5B21B6">liest ExternalSecret CR</text>

  <line x1="526" y1="162" x2="526" y2="192" stroke="#64748B" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="580" y="180" text-anchor="middle" font-size="9" fill="#64748B">erzeugt/aktualisiert</text>

  <!-- K8s Secret -->
  <rect x="436" y="196" width="180" height="52" fill="#F5F5F4" stroke="#78716C" stroke-width="2" rx="8"/>
  <text x="526" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#44403C">Kubernetes Secret</text>
  <text x="526" y="234" text-anchor="middle" font-size="9" fill="#44403C">(base64, im Cluster)</text>

  <line x1="526" y1="248" x2="526" y2="266" stroke="#64748B" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Pod -->
  <rect x="436" y="270" width="180" height="16" fill="none"/>
  <rect x="640" y="196" width="130" height="90" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" rx="8"/>
  <text x="705" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#1D4ED8">Pod</text>
  <text x="705" y="238" text-anchor="middle" font-size="9" fill="#1D4ED8">env / envFrom</text>
  <text x="705" y="252" text-anchor="middle" font-size="9" fill="#1D4ED8">oder Volume-Mount</text>

  <line x1="616" y1="222" x2="638" y2="222" stroke="#64748B" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Manifest reference note -->
  <rect x="436" y="270" width="180" height="1" fill="none"/>
  <rect x="24" y="308" width="772" height="52" fill="#EEF2FF" stroke="#6366F1" stroke-width="1" rx="6"/>
  <text x="410" y="328" text-anchor="middle" font-size="11" fill="#4338CA">Im Git-Manifest steht nur die `ExternalSecret`-Ressource mit der Secret-ARN — niemals der Wert selbst.</text>
  <text x="410" y="345" text-anchor="middle" font-size="11" fill="#4338CA">ESO holt den aktuellen Wert periodisch (refreshInterval) direkt aus AWS und hält das K8s-Secret synchron.</text>
</svg>
