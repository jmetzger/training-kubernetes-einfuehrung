<svg width="780" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="780" height="360" fill="#F8FAFC" rx="12"/>
  <text x="390" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">ENV-Variable vs. Volume Mount — Sicherheitsvergleich</text>

  <!-- ENV column -->
  <rect x="30" y="56" width="340" height="270" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" rx="10"/>
  <rect x="30" y="56" width="340" height="34" fill="#DC2626" rx="10"/>
  <rect x="30" y="72" width="340" height="18" fill="#DC2626"/>
  <text x="200" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ENV-Variable</text>

  <text x="48" y="112" font-size="11" fill="#991B1B">✗ kubectl exec pod -- env</text>
  <text x="48" y="134" font-size="11" fill="#991B1B">   zeigt Secret im Klartext</text>

  <text x="48" y="160" font-size="11" fill="#991B1B">✗ cat /proc/1/environ</text>
  <text x="48" y="182" font-size="11" fill="#991B1B">   im Container selbst auslesbar</text>

  <text x="48" y="208" font-size="11" fill="#991B1B">✗ wird an jeden Kindprozess</text>
  <text x="48" y="230" font-size="11" fill="#991B1B">   vererbt (Logging-Libs etc.)</text>

  <text x="48" y="256" font-size="11" fill="#991B1B">✗ landet oft in Crash-Dumps</text>
  <text x="48" y="278" font-size="11" fill="#991B1B">   / Error-Reporting-Tools</text>

  <text x="48" y="304" font-size="11" fill="#166534">✓ einfach zu nutzen, App-Support</text>
  <text x="48" y="322" font-size="11" fill="#166534">   fast überall gegeben</text>

  <!-- Volume column -->
  <rect x="410" y="56" width="340" height="270" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="10"/>
  <rect x="410" y="56" width="340" height="34" fill="#16A34A" rx="10"/>
  <rect x="410" y="72" width="340" height="18" fill="#16A34A"/>
  <text x="580" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Volume Mount (Datei)</text>

  <text x="428" y="112" font-size="11" fill="#166534">✓ nicht in "env" sichtbar</text>
  <text x="428" y="134" font-size="11" fill="#166534">   kein Leak über env-Dump</text>

  <text x="428" y="160" font-size="11" fill="#166534">✓ Datei-Rechte einschränkbar</text>
  <text x="428" y="182" font-size="11" fill="#166534">   (readOnly, defaultMode)</text>

  <text x="428" y="208" font-size="11" fill="#166534">✓ Update im Secret wird i.d.R.</text>
  <text x="428" y="230" font-size="11" fill="#166534">   automatisch nachgezogen</text>

  <text x="428" y="256" font-size="11" fill="#991B1B">✗ App muss Datei lesen können</text>
  <text x="428" y="278" font-size="11" fill="#991B1B">   (nicht jede Lib/Tool kann das)</text>

  <text x="428" y="304" font-size="11" fill="#991B1B">✗ liegt trotzdem unverschlüsselt</text>
  <text x="428" y="322" font-size="11" fill="#991B1B">   im Container-Dateisystem</text>

  <!-- Bottom -->
  <rect x="30" y="336" width="720" height="18" fill="none"/>
</svg>
