<svg width="780" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="780" height="380" fill="#F8FAFC" rx="12"/>
  <text x="390" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">Wege für Credentials in einen Container</text>

  <!-- Pod spec -->
  <rect x="24" y="150" width="150" height="80" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" rx="8"/>
  <text x="99" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338CA">Pod-Spec</text>
  <text x="99" y="204" text-anchor="middle" font-size="11" fill="#4338CA">(container)</text>

  <!-- 4 branches -->
  <line x1="174" y1="170" x2="240" y2="70" stroke="#64748B" stroke-width="2" marker-end="url(#arrA)"/>
  <line x1="174" y1="185" x2="240" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#arrA)"/>
  <line x1="174" y1="200" x2="240" y2="260" stroke="#64748B" stroke-width="2" marker-end="url(#arrA)"/>
  <line x1="174" y1="215" x2="240" y2="340" stroke="#64748B" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- Branch 1: fester value -->
  <rect x="243" y="42" width="250" height="56" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="8"/>
  <text x="368" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#991B1B">env: value: "s3cret"</text>
  <text x="368" y="82" text-anchor="middle" font-size="10" fill="#991B1B">fest im Manifest — NICHT sicher</text>

  <!-- Branch 2: secretKeyRef -->
  <rect x="243" y="132" width="250" height="56" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="368" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">env: valueFrom.secretKeyRef</text>
  <text x="368" y="172" text-anchor="middle" font-size="10" fill="#92400E">1 Key aus Secret → 1 ENV-Var</text>

  <!-- Branch 3: envFrom -->
  <rect x="243" y="232" width="250" height="56" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="368" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">envFrom.secretRef</text>
  <text x="368" y="272" text-anchor="middle" font-size="10" fill="#92400E">alle Keys aus Secret → ENV-Vars</text>

  <!-- Branch 4: volumeMount -->
  <rect x="243" y="312" width="250" height="56" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="368" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">volumeMounts (Secret als Datei)</text>
  <text x="368" y="352" text-anchor="middle" font-size="10" fill="#166534">z.B. /etc/secret/password — sicherer</text>

  <!-- Right side: Kubernetes Secret object -->
  <line x1="493" y1="160" x2="560" y2="160" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrA)"/>
  <line x1="493" y1="260" x2="560" y2="200" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrA)"/>
  <line x1="493" y1="340" x2="560" y2="240" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrA)"/>

  <rect x="563" y="150" width="190" height="100" fill="#F5F5F4" stroke="#78716C" stroke-width="2" rx="8"/>
  <text x="658" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#44403C">Kubernetes</text>
  <text x="658" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#44403C">Secret-Objekt</text>
  <text x="658" y="220" text-anchor="middle" font-size="10" fill="#44403C">(base64, kein Klartext</text>
  <text x="658" y="234" text-anchor="middle" font-size="10" fill="#44403C">im Manifest sichtbar)</text>

  <!-- Bottom note -->
  <rect x="24" y="0" width="1" height="1" fill="none"/>
</svg>
